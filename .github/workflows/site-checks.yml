name: Site checks

# Who deploys what
# ----------------
# Cloudflare Pages builds and publishes this site ITSELF: the Pages project
# `rental-assistance-services` is connected to this repository and runs
# `bash deploy/build.sh` (which verifies the bundle; a bad bundle fails the build
# and the previous deployment stays live). Every branch becomes a preview
# (https://<branch>.<project>.pages.dev, noindex, linked on the pull request by
# Cloudflare) and `main` becomes production. No deploy depends on GitHub Actions,
# so no GitHub spending limit can block one.
#
# This workflow does what Cloudflare cannot. Nothing below runs until
# deploy/config.env says CHECKS=on (deploy/config-check.sh then also requires
# VERIFIED_SINCE, the commit the approval checks start from).
#   after a merge   waits until production serves the merged commit, checks the
#                   deployment (deploy/check-live.sh --release), and checks that
#                   every commit that went live with it was merged by an approver
#                   (.github/scripts/deploy_gate.py). Both good: the step
#                   "Mark <commit> verified" gives the commit the status
#                   `site-checks/verified`, linked to this run; later checks walk
#                   back to the newest such marker, and the gate trusts a marker
#                   only if that run's step really succeeded. A deployment that
#                   fails its check, or that nobody approved, is rolled back to the
#                   last VERIFIED commit (never merely the last approved one: an
#                   approved merge can sit on top of an unapproved push) through
#                   deploy/pages_switch.py, and Slack is told. It alerts instead of
#                   rolling back when the approval cannot be checked, when the site
#                   cannot be reached, and when only the public address is wrong
#                   (pages.dev right: DNS or the domain, not this deployment).
#   daily 11:40     the full live check, "is production still main?", and "is
#                   anything live that nobody approved?". Silent when healthy.
#   Run workflow    check | rollback | accept (approvers only). accept = an
#                   approver has looked at what is live and takes it as the new
#                   starting point for the approval checks: after one unapproved
#                   commit, every later check would walk past it and fail.
#
# This is the one human approval: GitHub's free plan cannot protect `main` on a
# private repository and Cloudflare publishes whatever reaches `main`, so an
# unapproved change can be live for the minutes before its check rolls it back.
# It stops mistakes, not someone with write access who edits this file.
#
# Rollbacks need a Cloudflare token (CLOUDFLARE_API_TOKEN, Account > Cloudflare
# Pages > Edit, for the account holding the project). Without one, every place
# that would roll back alerts instead, with what to click.
#
# It runs on GitHub's machines in the rental-assistance-services organisation, on
# that organisation's own free minutes (about two minutes a run).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 11 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "check = the full live check now; rollback = make an earlier production deployment live; accept = an approver accepts what is live now as the starting point for the approval checks"
        type: choice
        options: [check, rollback, accept]
        default: check
      deployment:
        description: "rollback only: a Cloudflare deployment id (its first 8 characters are enough). Empty = the one before the live one."
        type: string
        default: ""

permissions:
  contents: read

env:
  APPROVERS: ${{ vars.DEPLOY_APPROVERS || 'ryankyleocampo-github asilber15' }}
  VERIFIED_CONTEXT: site-checks/verified
  # A Cloudflare deployment id, so an error message can never become a target.
  ID_RE: '^[0-9a-f][0-9a-f-]{7,35}$'
  # One run of deploy/check-live.sh takes at most this many seconds.
  CHECK_DEADLINE: "60"

jobs:
  # ---------------------------------------------------------------------------
  selftest:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prove the build guards fire
        run: bash deploy/selftest.sh
      # The approval gate and the rollback switch, against a simulated GitHub and
      # Cloudflare: every scenario the reviews reproduced. No network, no token.
      - name: Test the gate and the rollback switch
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -m unittest discover -s deploy -p 'test_*.py'

  # ---------------------------------------------------------------------------
  after-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The wait up to 10 minutes; the checks a few minutes; a rollback at most
    # 3 x 60 s on the target's own address plus 6 x (10 s + 60 s) in public.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    concurrency:
      group: pages-ras
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read deploy/config.env
        id: cfg
        run: |
          set -euo pipefail
          bash deploy/config-check.sh
          . deploy/config.env
          {
            echo "checks=${CHECKS}"
            echo "project=${PAGES_PROJECT}"
            echo "pages_url=${PAGES_URL}"
            echo "public_url=${PUBLIC_URL}"
            echo "verified_since=${VERIFIED_SINCE}"
          } >> "$GITHUB_OUTPUT"
          [ "${CHECKS}" = "on" ] || echo "::notice::CHECKS=${CHECKS} in deploy/config.env: the Cloudflare Pages project is not connected yet, so there is no deployment to check"

      - name: Wait until production serves this commit
        id: wait
        if: steps.cfg.outputs.checks == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.cfg.outputs.pages_url }}
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            live=$(curl -sS --proto '=https' -m 20 "${PAGES_URL}build.json?cb=${GITHUB_RUN_ID}-${i}" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "production serves ${GITHUB_SHA:0:7} (after about $((i * 15)) s)"
              echo "landed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A newer merge may have overtaken this one: then the newer run checks production.
            head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/dev/null || true)
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::main has moved on to ${head:0:7}; that run checks production"
              echo "landed=superseded" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::production did not start serving ${GITHUB_SHA:0:7} within 10 minutes: the Cloudflare build failed (its log is under"
          echo "::error::Workers & Pages > the project > Deployments), or production was rolled back on purpose and this is a re-run of an old check."
          echo "landed=false" >> "$GITHUB_OUTPUT"
          exit 1

      # After the wait: by now GitHub has linked the merge commit to its pull request.
      - name: Was everything that went live approved?
        id: gate
        if: steps.wait.outputs.landed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: push
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.triggering_actor }}
          BASE_COMMIT: ${{ steps.cfg.outputs.verified_since }}
        run: python3 .github/scripts/deploy_gate.py

      - name: Check the deployment
        id: check
        if: steps.wait.outputs.landed == 'true'
        env:
          PAGES_URL: ${{ steps.cfg.outputs.pages_url }}
          PUBLIC_URL: ${{ steps.cfg.outputs.public_url }}
        run: |
          set -uo pipefail
          # The deployment itself, on the project's own address...
          pages=0
          bash deploy/check-live.sh --release --url "$PAGES_URL" --expect-commit "$GITHUB_SHA" || pages=$?
          # ...then, once the domain points here, the public address.
          public=0
          if [ "$pages" = "0" ] && [ -n "$PUBLIC_URL" ]; then
            for attempt in 1 2 3 4 5 6; do
              public=0
              bash deploy/check-live.sh --release --url "$PUBLIC_URL" --expect-commit "$GITHUB_SHA" || public=$?
              [ "$public" = "0" ] && break
              echo "public address check attempt ${attempt}/6 exited ${public}"
              sleep 10
            done
          fi
          { echo "pages=${pages}"; echo "public=${public}"; } >> "$GITHUB_OUTPUT"

      - name: Decide
        id: act
        if: steps.wait.outputs.landed == 'true'
        env:
          APPROVED: ${{ steps.gate.outputs.approved }}
          REASON: ${{ steps.gate.outputs.reason }}
          PAGES_RC: ${{ steps.check.outputs.pages }}
          PUBLIC_RC: ${{ steps.check.outputs.public }}
          PAGES_URL: ${{ steps.cfg.outputs.pages_url }}
          PUBLIC_URL: ${{ steps.cfg.outputs.public_url }}
        run: |
          set -uo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          if [ "$APPROVED" = "true" ] && [ "$PAGES_RC" = "0" ] && [ "$PUBLIC_RC" = "0" ]; then
            out verdict=good; exit 0
          fi
          # The deployment itself is wrong: it goes, whatever the approval says.
          if [ "$PAGES_RC" = "1" ]; then
            out verdict=rollback; out "why=failed its check on ${PAGES_URL}"; exit 0
          fi
          if [ "$APPROVED" = "false" ]; then
            out verdict=rollback; out "why=was not approved (${REASON})"; exit 0
          fi
          if [ "$APPROVED" != "true" ]; then
            out verdict=approval-unknown; out "why=the approval could not be checked (${REASON:-no answer})"; exit 1
          fi
          if [ "$PAGES_RC" != "0" ]; then
            out verdict=unreachable; out "why=could not be reached to check it"; exit 1
          fi
          # The deployment is right on its own address; only the public address is not.
          # That is DNS or the domain, not this deployment: rolling back would not help.
          out verdict=public-only
          out "why=is right on ${PAGES_URL}, but ${PUBLIC_URL} does not serve it (check exit ${PUBLIC_RC}): DNS or the custom domain, not this deployment"
          exit 1

      # Named for the commit on purpose: deploy_gate.py trusts a verified marker only
      # when the run it links to has a successful step named exactly this.
      - name: Mark ${{ github.sha }} verified
        id: mark
        if: steps.act.outputs.verdict == 'good'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success \
            -f context="$VERIFIED_CONTEXT" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            -f description="live, checked, every commit approved" > /dev/null
          echo "### Live, checked and approved: ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"

      # --no-put-back: the deployment being removed never comes back, from the tool
      # or from a cancel. --only-if-live-commit: if anything newer went live
      # meanwhile, it is left alone (read again right before the switch).
      - name: Roll back to the last verified commit
        id: rollback
        if: steps.act.outputs.verdict == 'rollback'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.cfg.outputs.project }}
          PAGES_URL: ${{ steps.cfg.outputs.pages_url }}
          PUBLIC_URL: ${{ steps.cfg.outputs.public_url }}
          BASE_COMMIT: ${{ steps.cfg.outputs.verified_since }}
        run: |
          set -uo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            out outcome=no-token; exit 1
          fi
          target=$(python3 .github/scripts/deploy_gate.py --last-verified-before "$GITHUB_SHA") || target=""
          if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            out outcome=no-target; exit 1
          fi
          out "target=${target}"
          rc=0
          python3 deploy/pages_switch.py --project "$PROJECT" --to-commit "$target" --no-put-back \
            --only-if-live-commit "$GITHUB_SHA" --public-url "${PUBLIC_URL:-$PAGES_URL}" \
            --check "bash deploy/check-live.sh --release" --attempts 6 --wait 10 || rc=$?
          case "$rc" in
            0) o="rolled-back" ;;
            2) o="no-target" ;;
            3) o="target-refused" ;;
            4) o="rolled-back-unverified" ;;
            6) o="unconfirmed" ;;
            7) o="superseded" ;;
            8) o="already-rolled-back" ;;
            *) o="failed" ;;
          esac
          out "outcome=${o}"
          case "$o" in superseded|already-rolled-back) exit 0 ;; esac
          exit 1

      - name: Tell Slack
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LANDED: ${{ steps.wait.outputs.landed }}
          VERDICT: ${{ steps.act.outputs.verdict }}
          WHY: ${{ steps.act.outputs.why }}
          MARK: ${{ steps.mark.outcome }}
          OUTCOME: ${{ steps.rollback.outputs.outcome }}
          TARGET: ${{ steps.rollback.outputs.target }}
          PROJECT: ${{ steps.cfg.outputs.project }}
          JOB: ${{ job.status }}
        run: |
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          C="${GITHUB_SHA:0:7}"
          HAND="Cloudflare > Workers & Pages > ${PROJECT} > Deployments > the last good deployment > Rollback to this deployment."
          if [ "$JOB" = "cancelled" ]; then
            T="🟠 RAS site: the check after ${C} was cancelled part-way (${VERDICT:-before a verdict}${OUTCOME:+, rollback ${OUTCOME}}). Check which version is live: /build.json."
          elif [ "$LANDED" = "false" ]; then
            T="🔴 RAS site: production did not start serving ${C} within 10 minutes. The Cloudflare build failed (see its log), or production was rolled back on purpose and this is a re-run of an old check. The previous version is still live."
          elif [ "$VERDICT" = "good" ] && [ "$MARK" != "success" ]; then
            T="🟠 RAS site: ${C} is live, checked and approved, but the verified marker could not be posted, so later checks walk further back. Re-run this job."
          elif [ "$VERDICT" = "rollback" ]; then
            case "$OUTCOME" in
              rolled-back)            W="Production was rolled back to the last verified commit (${TARGET:0:7}), and that was verified in public." ;;
              rolled-back-unverified) W="Production was rolled back to the last verified commit (${TARGET:0:7}), but the public address has not confirmed it. Check it now." ;;
              unconfirmed)            W="The rollback could not be confirmed either way. Production may be wrong right now. ${HAND}" ;;
              target-refused)         W="The last verified deployment (${TARGET:0:7}) failed, or could not get through, its own check, so production was left as is. ${HAND}" ;;
              no-token)               W="There is no Cloudflare token in this repository to roll back with. ${HAND}" ;;
              no-target)              W="No verified commit with a deployment was found to roll back to. ${HAND}" ;;
              *)                      W="The rollback FAILED. The site may be wrong right now. ${HAND}" ;;
            esac
            T="🔴 RAS site: ${C} ${WHY}. ${W}"
          elif [ "$VERDICT" = "approval-unknown" ]; then
            T="🟠 RAS site: ${C} is live, but ${WHY}. Not rolled back. Re-run this job; if it stays unknown, an approver reviews what went live and runs action=accept, or reverts it."
          elif [ "$VERDICT" = "unreachable" ]; then
            T="🟠 RAS site: ${C} ${WHY}; not rolled back (no answer is not evidence). Check it now."
          elif [ "$VERDICT" = "public-only" ]; then
            T="🟠 RAS site: ${C} ${WHY}. Not rolled back. Check the www record at GoDaddy and the custom domain in Cloudflare."
          else
            T="🔴 RAS site checks failed after ${C}; see the run."
          fi
          python3 .github/scripts/notify_slack.py "${T} ${RUN}"

  # ---------------------------------------------------------------------------
  daily:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Is the live site healthy, is it main, and was all of it approved?
        id: live
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          bash deploy/config-check.sh || exit 1
          . deploy/config.env
          if [ "${CHECKS}" != "on" ]; then
            echo "::notice::CHECKS=${CHECKS}: the Cloudflare Pages project is not connected yet; nothing to check"
            exit 0
          fi
          url="${PUBLIC_URL:-$PAGES_URL}"
          problems=()
          rc=0
          bash deploy/check-live.sh --url "$url" || rc=$?
          [ "$rc" = "1" ] && problems+=("the live check found a problem (a page, the bare-domain forward or a dev file; the run log says which)")
          [ "$rc" = "2" ] && problems+=("the site could not be checked (no answer or a server error)")
          live=$(curl -sS --proto '=https' -m 20 "${url}build.json?cb=d-${GITHUB_RUN_ID}" 2>/dev/null \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/dev/null || true)
          if [ -z "$live" ] || [ -z "$main_sha" ]; then
            problems+=("could not read the live commit or main's head")
          elif [ "$live" != "$main_sha" ]; then
            problems+=("production serves ${live:0:7} but main is ${main_sha:0:7}: a rollback is in place (fix main with a revert pull request) or a Cloudflare build failed")
          fi
          # Anything live that nobody approved, including a push that skipped CI. A
          # genuine verified marker settles it; otherwise the gate walks it again.
          if [[ "$live" =~ ^[0-9a-f]{40}$ ]]; then
            vrc=0
            python3 .github/scripts/deploy_gate.py --is-verified "$live" || vrc=$?
            if [ "$vrc" != "0" ]; then
              verdict=$(EVENT=push SHA="$live" BASE_COMMIT="$VERIFIED_SINCE" python3 .github/scripts/deploy_gate.py | sed -nE 's/^approved=([a-z]+):.*/\1/p')
              if [ "$verdict" != "true" ]; then
                problems+=("the live commit ${live:0:7} was never verified and its approval is '${verdict:-unknown}': an approver reviews it and runs action=accept, or reverts it")
              fi
            fi
          fi
          if [ "${#problems[@]}" -gt 0 ]; then
            for p in "${problems[@]}"; do echo "::error::$p"; done
            joined=$(printf '%s; ' "${problems[@]}")
            echo "problems=${joined%; }" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "healthy: production serves ${live:0:7}, which is main, checked and approved"
      - name: Tell Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PROBLEMS: ${{ steps.live.outputs.problems }}
        run: |
          python3 .github/scripts/notify_slack.py "🟠 RAS site daily check FAILED: ${PROBLEMS:-see the run}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # ---------------------------------------------------------------------------
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages-ras
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Roll back and verify (approvers only)
        id: switch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WANT: ${{ inputs.deployment }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -uo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          if ! python3 .github/scripts/deploy_gate.py --is-approver "$ACTOR"; then
            echo "::error::${ACTOR} is not an approver"; out verdict=refused; exit 1
          fi
          bash deploy/config-check.sh || { out verdict=refused; exit 1; }
          . deploy/config.env
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::no Cloudflare token in this repository: roll back in the dashboard (Workers & Pages > ${PAGES_PROJECT} > Deployments > Rollback to this deployment)"
            out verdict=no-token; exit 1
          fi
          if [ -n "$WANT" ]; then
            [[ "$WANT" =~ $ID_RE ]] || { echo "::error::'${WANT}' is not a deployment id"; out verdict=refused; exit 1; }
            sel=(--to "$WANT")
          else
            sel=(--previous)
          fi
          rc=0
          python3 deploy/pages_switch.py --project "$PAGES_PROJECT" "${sel[@]}" \
            --public-url "${PUBLIC_URL:-$PAGES_URL}" --check "bash deploy/check-live.sh --release" \
            --state-file "$RUNNER_TEMP/pages-switch.json" --attempts 6 --wait 10 || rc=$?
          case "$rc" in
            0) v=good ;; 1) v=not-switched ;; 2) v=no-target ;; 3) v=target-refused ;;
            4) v=unverified ;; 5) v=put-back ;; 6) v=may-be-wrong ;; 8) v=already-live ;; *) v=error ;;
          esac
          out "verdict=${v}"
          [ "$rc" = "8" ] && exit 0
          exit "$rc"
      - name: Restore what was live if this job was cancelled mid-switch
        id: restore
        if: cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          bash deploy/config-check.sh || { echo "restore=not-attempted" >> "$GITHUB_OUTPUT"; exit 1; }
          . deploy/config.env
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || exit 0
          rc=0
          python3 deploy/pages_switch.py --project "$PAGES_PROJECT" --restore "$RUNNER_TEMP/pages-switch.json" \
            --public-url "${PUBLIC_URL:-$PAGES_URL}" --check "bash deploy/check-live.sh --release" \
            --attempts 6 --wait 10 || rc=$?
          case "$rc" in 0) r=nothing-to-restore ;; 5) r=put-back-verified ;; *) r=put-back-failed ;; esac
          echo "restore=${r}" >> "$GITHUB_OUTPUT"
      - name: Tell Slack
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERDICT: ${{ steps.switch.outputs.verdict }}
          RESTORE: ${{ steps.restore.outputs.restore }}
        run: |
          case "$VERDICT" in
            refused)        W="Refused: not started by an approver, not a deployment id, or a bad deploy/config.env. Nothing changed." ;;
            no-token)       W="There is no Cloudflare token in this repository; roll back in the Cloudflare dashboard. Nothing changed." ;;
            not-switched)   W="Cloudflare did not switch production. Nothing changed." ;;
            no-target)      W="There is no earlier successful deployment to switch to. Nothing changed." ;;
            target-refused) W="The chosen deployment failed, or could not get through, its own check, so production was not touched." ;;
            unverified)     W="Switched, but the public address has not confirmed it (unreachable, or still showing the old version). Check it now." ;;
            put-back)       W="The chosen deployment passed its own check but the public address did not serve it, so production was put back, and that was verified." ;;
            may-be-wrong)   W="Production may be wrong right now: putting it back failed, or the switch could not be confirmed. Check it now." ;;
            *) case "$RESTORE" in
                 put-back-verified)  W="The run was cancelled mid-switch; what was live before was put back and verified." ;;
                 put-back-failed)    W="The run was cancelled mid-switch and putting back what was live FAILED. Check it now." ;;
                 nothing-to-restore) W="The run was cancelled before anything was switched." ;;
                 *)                  W="See the run; check which version is live: /build.json." ;;
               esac ;;
          esac
          python3 .github/scripts/notify_slack.py "🔴 RAS site rollback: ${W} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # ---------------------------------------------------------------------------
  # After one unapproved commit, every later approval check walks past it and
  # fails, even for approved merges. An approver who has looked at what is live
  # can accept it: it then carries a genuine verified marker and later checks stop
  # there. Accepting takes responsibility for everything up to that commit.
  accept:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'accept' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: pages-ras
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Who asked, and is what is live healthy?
        id: live
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -uo pipefail
          if ! python3 .github/scripts/deploy_gate.py --is-approver "$ACTOR"; then
            echo "::error::${ACTOR} is not an approver; only an approver can accept what is live"; exit 1
          fi
          bash deploy/config-check.sh || exit 1
          . deploy/config.env
          [ "${CHECKS}" = "on" ] || { echo "::error::CHECKS is not on; there is nothing to accept yet"; exit 1; }
          live=$(curl -sS --proto '=https' -m 20 "${PAGES_URL}build.json?cb=a-${GITHUB_RUN_ID}" 2>/dev/null \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
          [[ "$live" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::could not read the live commit from ${PAGES_URL}build.json"; exit 1; }
          rc=0
          bash deploy/check-live.sh --release --url "$PAGES_URL" --expect-commit "$live" || rc=$?
          [ "$rc" = "0" ] || { echo "::error::the live deployment does not pass its check (exit ${rc}); fix it or roll back first"; exit 1; }
          echo "commit=${live}" >> "$GITHUB_OUTPUT"
      # Named for the commit on purpose: deploy_gate.py trusts the marker only when
      # this run has a successful step named exactly "Mark <commit> verified".
      - name: Mark ${{ steps.live.outputs.commit }} verified
        id: mark
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.live.outputs.commit }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${COMMIT}" -f state=success \
            -f context="$VERIFIED_CONTEXT" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}" \
            -f description="accepted by ${ACTOR}" > /dev/null
          echo "### ${COMMIT:0:7} accepted by ${ACTOR}: the approval checks start from it now" >> "$GITHUB_STEP_SUMMARY"
      - name: Tell Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT: ${{ steps.live.outputs.commit }}
          MARK: ${{ steps.mark.outcome }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$MARK" = "success" ]; then
            T="🟢 RAS site: ${ACTOR} accepted what is live (${COMMIT:0:7}); the approval checks start from it now."
          else
            T="🔴 RAS site: accept by ${ACTOR} was refused or failed; nothing was marked."
          fi
          python3 .github/scripts/notify_slack.py "${T} ${RUN}"
