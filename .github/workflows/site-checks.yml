name: Site checks

# Who deploys what
# ----------------
# Cloudflare Pages builds and publishes this site ITSELF: the Pages project
# `rental-assistance-services` is connected to this repository and runs
# `bash deploy/build.sh` (which verifies the bundle; a bad bundle fails the build
# and the previous deployment stays live). Every branch becomes a preview
# (https://<branch>.<project>.pages.dev, noindex, linked on the pull request by
# Cloudflare) and `main` becomes production. No deploy depends on GitHub Actions,
# so no GitHub spending limit can block one.
#
# This workflow does what Cloudflare cannot. Nothing below runs until
# deploy/config.env says CHECKS=on.
#   after a merge   waits until production serves the merged commit, checks the
#                   deployment (deploy/check-live.sh --release), and checks that
#                   every commit that went live with it was merged by an approver
#                   (.github/scripts/deploy_gate.py). Both good: the commit gets
#                   the status `site-checks/verified`, the marker later checks walk
#                   back to. A wrong deployment or an unapproved commit is rolled
#                   back to the last approved commit through deploy/pages_switch.py
#                   (checks the target first, never acts if a newer deployment
#                   already took over) and Slack is told. When the approval cannot
#                   be checked, or the site cannot be reached, it only alerts.
#   daily 11:40     the full live check, "is production still main?", and "is
#                   anything live that nobody approved?". Silent when healthy.
#   Run workflow    action = check | rollback (approvers only).
#
# This is the one human approval: GitHub's free plan cannot protect `main` on a
# private repository and Cloudflare publishes whatever reaches `main`, so an
# unapproved change can be live for the minutes before its check rolls it back.
# It stops mistakes, not someone with write access who edits this file.
#
# Rollbacks need a Cloudflare token (CLOUDFLARE_API_TOKEN, Account > Cloudflare
# Pages > Edit, for the account holding the project). Without one, every place
# that would roll back alerts instead, with what to click.
#
# It runs on GitHub's machines in the rental-assistance-services organisation, on
# that organisation's own free minutes (about two minutes a run).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 11 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "check = run the full live check now; rollback = make an earlier production deployment live"
        type: choice
        options: [check, rollback]
        default: check
      deployment:
        description: "rollback only: a Cloudflare deployment id (the 8-character prefix is enough). Empty = the one before the live one."
        type: string
        default: ""

permissions:
  contents: read

env:
  APPROVERS: ${{ vars.DEPLOY_APPROVERS || 'ryankyleocampo-github asilber15' }}
  VERIFIED_CONTEXT: site-checks/verified
  # The one repo file sourced by the jobs: plain assignments only.
  CONFIG_OK_RE: '^(#.*)?$|^[A-Z_]+=[A-Za-z0-9._/:-]*$'

jobs:
  # ---------------------------------------------------------------------------
  selftest:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prove the build guards fire
        run: bash deploy/selftest.sh

  # ---------------------------------------------------------------------------
  after-deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: pages-ras
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Read deploy/config.env
        id: cfg
        run: |
          set -euo pipefail
          if grep -qvE "$CONFIG_OK_RE" deploy/config.env; then
            echo "::error::deploy/config.env holds a line that is not a comment or a plain assignment; it will not be sourced"
            exit 1
          fi
          . deploy/config.env
          {
            echo "checks=${CHECKS}"
            echo "project=${PAGES_PROJECT}"
            echo "pages_url=${PAGES_URL}"
            echo "public_url=${PUBLIC_URL}"
            echo "verified_since=${VERIFIED_SINCE}"
          } >> "$GITHUB_OUTPUT"
          [ "${CHECKS}" = "on" ] || echo "::notice::CHECKS=${CHECKS} in deploy/config.env: the Cloudflare Pages project is not connected yet, so there is no deployment to check"

      - name: Wait until production serves this commit
        id: wait
        if: steps.cfg.outputs.checks == 'on'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_URL: ${{ steps.cfg.outputs.pages_url }}
        run: |
          set -uo pipefail
          for i in $(seq 1 40); do
            live=$(curl -sS --proto '=https' -m 20 "${PAGES_URL}build.json?cb=${GITHUB_RUN_ID}-${i}" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "production serves ${GITHUB_SHA:0:7} (after about $((i * 15)) s)"
              echo "landed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A newer merge may have overtaken this one: then the newer run checks production.
            head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/dev/null || true)
            if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
              echo "::notice::main has moved on to ${head:0:7}; that run checks production"
              echo "landed=superseded" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::error::production did not start serving ${GITHUB_SHA:0:7} within 10 minutes. Cloudflare's build probably failed"
          echo "::error::(Workers & Pages > the project > Deployments shows its log); the previous deployment is still live."
          echo "landed=false" >> "$GITHUB_OUTPUT"
          exit 1

      # After the wait: by now GitHub has linked the merge commit to its pull request.
      - name: Was everything that went live approved?
        id: gate
        if: steps.wait.outputs.landed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: push
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.triggering_actor }}
          BASE_COMMIT: ${{ steps.cfg.outputs.verified_since }}
        run: python3 .github/scripts/deploy_gate.py

      - name: Check the deployment
        id: check
        if: steps.wait.outputs.landed == 'true'
        env:
          PAGES_URL: ${{ steps.cfg.outputs.pages_url }}
          PUBLIC_URL: ${{ steps.cfg.outputs.public_url }}
        run: |
          set -uo pipefail
          rc=0
          bash deploy/check-live.sh --release --url "$PAGES_URL" --expect-commit "$GITHUB_SHA" || rc=$?
          if [ "$rc" = "0" ] && [ -n "$PUBLIC_URL" ]; then
            for attempt in 1 2 3 4 5 6; do
              rc=0
              bash deploy/check-live.sh --release --url "$PUBLIC_URL" --expect-commit "$GITHUB_SHA" || rc=$?
              [ "$rc" = "0" ] && break
              echo "public address check attempt ${attempt}/6 exited ${rc}"
              sleep 10
            done
          fi
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Mark it verified, or roll back, or alert
        id: act
        if: steps.wait.outputs.landed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.cfg.outputs.project }}
          PAGES_URL: ${{ steps.cfg.outputs.pages_url }}
          PUBLIC_URL: ${{ steps.cfg.outputs.public_url }}
          APPROVED: ${{ steps.gate.outputs.approved }}
          REASON: ${{ steps.gate.outputs.reason }}
          RC: ${{ steps.check.outputs.rc }}
        run: |
          set -uo pipefail
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          if [ "$APPROVED" = "true" ] && [ "$RC" = "0" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success \
              -f context="$VERIFIED_CONTEXT" -f description="live, checked, every commit approved" > /dev/null
            out verdict=good
            echo "### Live, checked and approved: ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$APPROVED" = "unknown" ]; then
            out "verdict=approval-unknown"; out "why=the approval could not be checked (${REASON})"; exit 1
          fi
          if [ "$APPROVED" != "false" ] && [ "$RC" = "2" ]; then
            out verdict=unreachable; out "why=the deployment could not be reached to check it"; exit 1
          fi
          if [ "$APPROVED" = "false" ]; then why="was not approved (${REASON})"; else why="failed its check"; fi
          out "why=${why}"
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            out verdict=rollback-needed-no-token; exit 1
          fi
          target=$(python3 .github/scripts/deploy_gate.py --last-approved-before "$GITHUB_SHA" | tail -n1)
          if ! printf '%s' "$target" | grep -qE '^[0-9a-f]{40}$'; then
            out verdict=rollback-no-target; exit 1
          fi
          rc=0
          python3 deploy/pages_switch.py --project "$PROJECT" --to-commit "$target" --only-if-live-commit "$GITHUB_SHA" \
            --public-url "${PUBLIC_URL:-$PAGES_URL}" --check "bash deploy/check-live.sh --release" \
            --state-file "$RUNNER_TEMP/pages-switch.json" || rc=$?
          case "$rc" in
            0) out verdict=rolled-back ;;       4) out verdict=rolled-back-unverified ;;
            7) out verdict=superseded; exit 0 ;; 3) out verdict=rollback-target-refused ;;
            5) out verdict=rollback-put-back ;; *) out verdict=rollback-failed ;;
          esac
          exit 1

      - name: Restore what was live if this job was cancelled mid-switch
        if: cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ steps.cfg.outputs.project }}
        run: |
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || exit 0
          python3 deploy/pages_switch.py --project "$PROJECT" --restore "$RUNNER_TEMP/pages-switch.json" --check "bash deploy/check-live.sh --release" || true

      - name: Tell Slack
        if: failure() || cancelled()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LANDED: ${{ steps.wait.outputs.landed }}
          VERDICT: ${{ steps.act.outputs.verdict }}
          WHY: ${{ steps.act.outputs.why }}
          PROJECT: ${{ steps.cfg.outputs.project }}
        run: |
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          C="${GITHUB_SHA:0:7}"
          HAND="Cloudflare > Workers & Pages > ${PROJECT} > Deployments > the previous deployment > Rollback to this deployment."
          case "$LANDED/$VERDICT" in
            false/*)                     T="🔴 RAS site: production did not update to ${C} within 10 minutes (Cloudflare build failed?). The previous version is still live." ;;
            */rolled-back)               T="🔴 RAS site: ${C} ${WHY}. Production was rolled back to the last approved commit and verified." ;;
            */rolled-back-unverified)    T="🔴 RAS site: ${C} ${WHY}. Production was rolled back, but the public site could not be reached to verify it." ;;
            */rollback-target-refused)   T="🔴 RAS site: ${C} ${WHY}, and the last approved deployment failed its own check, so production was left as is. ${HAND}" ;;
            */rollback-put-back)         T="🔴 RAS site: ${C} ${WHY}; the rollback target was wrong in public, so production was put back. Check it now." ;;
            */rollback-needed-no-token)  T="🔴 RAS site: ${C} ${WHY}, and there is no Cloudflare token to roll back with. ${HAND}" ;;
            */rollback-no-target)        T="🔴 RAS site: ${C} ${WHY}, and no approved commit was found to roll back to. ${HAND}" ;;
            */rollback-failed)           T="🔴 RAS site: ${C} ${WHY} AND the rollback failed. The site may be wrong right now. ${HAND}" ;;
            */approval-unknown)          T="🟠 RAS site: ${C} is live, but ${WHY}. Not rolled back. Re-run the check." ;;
            */unreachable)               T="🟠 RAS site: ${C} could not be reached to check it; not rolled back. Check it now." ;;
            *)                           T="🔴 RAS site checks failed or were cancelled after ${C}." ;;
          esac
          python3 .github/scripts/notify_slack.py "${T} ${RUN}"

  # ---------------------------------------------------------------------------
  daily:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'check')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Is the live site healthy, is it main, and was all of it approved?
        id: live
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if grep -qvE "$CONFIG_OK_RE" deploy/config.env; then
            echo "::error::deploy/config.env holds a line that is not a plain assignment"; exit 1
          fi
          . deploy/config.env
          if [ "${CHECKS}" != "on" ]; then
            echo "::notice::CHECKS=${CHECKS}: the Cloudflare Pages project is not connected yet; nothing to check"
            echo "skipped=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          url="${PUBLIC_URL:-$PAGES_URL}"
          rc=0
          bash deploy/check-live.sh --url "$url" || rc=$?
          live=$(curl -sS --proto '=https' -m 20 "${url}build.json?cb=d-${GITHUB_RUN_ID}" 2>/dev/null \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha 2>/dev/null || true)
          if [ -z "$live" ] || [ -z "$main_sha" ]; then
            echo "::error::could not read the live commit or main's head"; [ "$rc" = "0" ] && rc=1
          elif [ "$live" != "$main_sha" ]; then
            echo "::error::production serves ${live:0:7}, main is ${main_sha:0:7}: a rollback is in place (fix main with a revert pull request) or a build failed"
            [ "$rc" = "0" ] && rc=1
          fi
          # A push that skipped CI, or anything the after-deploy check never saw, is caught here.
          if [ -n "$live" ]; then
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${live}/status" \
                      --jq "[.statuses[] | select(.context == \"${VERIFIED_CONTEXT}\")][0].state" 2>/dev/null || true)
            if [ "$state" != "success" ]; then
              verdict=$(EVENT=push SHA="$live" BASE_COMMIT="$VERIFIED_SINCE" python3 .github/scripts/deploy_gate.py | sed -nE 's/^approved=([a-z]+):.*/\1/p')
              if [ "$verdict" != "true" ]; then
                echo "::error::the live commit ${live:0:7} was never verified, and its approval is '${verdict:-unknown}'"
                [ "$rc" = "0" ] && rc=1
              fi
            fi
          fi
          exit "$rc"
      - name: Tell Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 .github/scripts/notify_slack.py "🟠 RAS site daily check FAILED: a page, the bare-domain forward, a dev file, production not being main, or something live that nobody approved. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  # ---------------------------------------------------------------------------
  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'rollback' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages-ras
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Roll back and verify (approvers only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WANT: ${{ inputs.deployment }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -uo pipefail
          if [[ " ${APPROVERS,,} " != *" ${ACTOR,,} "* ]]; then
            echo "::error::${ACTOR} is not an approver"; exit 1
          fi
          if grep -qvE "$CONFIG_OK_RE" deploy/config.env; then
            echo "::error::deploy/config.env holds a line that is not a plain assignment"; exit 1
          fi
          . deploy/config.env
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::no Cloudflare token in this repository: roll back in the dashboard (Workers & Pages > ${PAGES_PROJECT} > Deployments > Rollback to this deployment)"
            exit 1
          fi
          if [ -n "$WANT" ]; then
            [[ "$WANT" =~ ^[0-9a-f-]{8,36}$ ]] || { echo "::error::'${WANT}' is not a deployment id"; exit 1; }
            sel=(--to "$WANT")
          else
            sel=(--previous)
          fi
          python3 deploy/pages_switch.py --project "$PAGES_PROJECT" "${sel[@]}" \
            --public-url "${PUBLIC_URL:-$PAGES_URL}" --check "bash deploy/check-live.sh --release" \
            --state-file "$RUNNER_TEMP/pages-switch.json"
      - name: Restore what was live if this job was cancelled mid-switch
        if: cancelled()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          . deploy/config.env
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || exit 0
          python3 deploy/pages_switch.py --project "$PAGES_PROJECT" --restore "$RUNNER_TEMP/pages-switch.json" --check "bash deploy/check-live.sh --release" || true
      - name: Tell Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          python3 .github/scripts/notify_slack.py "🔴 RAS site rollback FAILED or was refused; check which deployment is live (/build.json). ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
