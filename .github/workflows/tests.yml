name: intake form tests

# The forms on this site POST real applications into the CRM. They were dead for 41 days
# because a browser-only bug (fetch called with `headers: null`) is invisible to any test
# that talks to the endpoint with an HTTP client. These tests run a real browser.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
